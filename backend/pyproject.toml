[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "CareerPilot FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.2",
    "email-validator==2.3.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "psycopg[binary]==3.3.5",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
